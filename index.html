<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Menu, prices, location and hours for The Snack Shack." />
  <title>The Snack Shack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <section class="photo-hero" aria-labelledby="page-title">
      <h1 class="page-title" id="page-title">The Snack Shack</h1>
      <img class="hero-photo" src="images/hero.png" alt="An assortment of packaged chips" width="880" height="880" fetchpriority="high" />
    </section>

    <section class="menu-section" id="menu" aria-labelledby="menu-title">
      <div class="section-heading">
        <div><h2 id="menu-title">Menu</h2></div>
      </div>
      <div class="menu-grid" id="menu-grid">
        <article class="menu-card">
          <div class="product-art"><img src="images/doritos.png" alt="Doritos Cool Ranch package" loading="lazy" /></div>
          <div class="card-body"><div class="card-top"><h3>Doritos Cool Ranch</h3><span class="price">$2</span></div></div>
        </article>
        <article class="menu-card">
          <div class="product-art"><img src="images/hot_cheeto.png" alt="Flamin’ Hot Cheetos package" loading="lazy" /></div>
          <div class="card-body"><div class="card-top"><h3>Flamin’ Hot Cheetos</h3><span class="price">$2</span></div></div>
        </article>
        <article class="menu-card">
          <div class="product-art"><img src="images/kitkat.png" alt="KitKat package" loading="lazy" /></div>
          <div class="card-body"><div class="card-top"><h3>KitKat</h3><span class="price">$2</span></div></div>
        </article>
        <article class="menu-card">
          <div class="product-art"><img src="images/reeses.png" alt="Reese’s Peanut Butter Cups package" loading="lazy" /></div>
          <div class="card-body"><div class="card-top"><h3>Reese’s Peanut Butter Cups</h3><span class="price">$2</span></div></div>
        </article>
        <article class="menu-card">
          <div class="product-art"><img src="images/skittles.png" alt="Skittles Original package" loading="lazy" /></div>
          <div class="card-body"><div class="card-top"><h3>Skittles Original</h3><span class="price">$2</span></div></div>
        </article>
        <article class="menu-card">
          <div class="product-art"><img src="images/sour_patch_kids.png" alt="Sour Patch Kids package" loading="lazy" /></div>
          <div class="card-body"><div class="card-top"><h3>Sour Patch Kids</h3><span class="price">$2</span></div></div>
        </article>
        <article class="menu-card">
          <div class="product-art"><img src="images/takis.png" alt="Takis Fuego package" loading="lazy" /></div>
          <div class="card-body"><div class="card-top"><h3>Takis Fuego</h3><span class="price">$2</span></div></div>
        </article>
        <article class="menu-card">
          <div class="product-art"><img src="images/trolli.png" alt="Trolli Sour Brite Crawlers package" loading="lazy" /></div>
          <div class="card-body"><div class="card-top"><h3>Trolli Sour Brite Crawlers</h3><span class="price">$2</span></div></div>
        </article>
      </div>
    </section>

    <section class="bottom-location" id="where" aria-labelledby="bottom-location-title">
      <div class="bottom-location-copy"><h2 id="bottom-location-title">Location and hours</h2><p>Yellow stand outside the student center<br />Every school day, 11:30–1:00</p></div>
    </section>

  </main>
</body>
</html>
